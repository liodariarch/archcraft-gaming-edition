# Archcraft GE | Picom (X11)
# Este perfil es opcional. No reemplaza el picom.conf original.
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.34;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'desktop'",
  "window_type = 'dock'"
];

fading = true;
fade-delta = 5;
fade-in-step = 0.035;
fade-out-step = 0.035;

inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;

# El desenfoque depende de que la compilación instalada de Picom lo soporte.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'Rofi'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
