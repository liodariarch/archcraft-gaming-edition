; Archcraft GE | Lightweight example bar
; Installed separately under ~/.config/archcraft-ge/polybar/ so it will not
; overwrite an existing Archcraft/Polybar setup.

[colors]
background = #e60d111b
background-alt = #ff151e2b
foreground = #ffe6f1ff
muted = #ff8293a8
cyan = #ff35d9ff
violet = #ff9b7bff
orange = #ffff8c42

[bar/ge]
monitor = ${env:MONITOR:}
width = 100%
height = 30
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
override-redirect = true
wm-restack = generic
bottom = false
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrains Mono:size=9;2
font-1 = Symbols Nerd Font:size=10;2
modules-left = ge-tag xworkspaces
modules-center = xwindow
modules-right = cpu memory pulseaudio date

[settings]
screenchange-reload = true
audio = pulse

[module/ge-tag]
type = custom/text
content = " ARCHCRAFT GE "
content-foreground = ${colors.cyan}
content-font = 1

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
label-active = %name%
label-active-foreground = ${colors.cyan}
label-active-padding = 2
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:55:...%
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage:2%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.cyan}
label-muted = VOL muted
label-muted-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}
