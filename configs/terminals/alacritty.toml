# Archcraft GE terminal profile for Alacritty.
[window]
opacity = 0.96
padding = { x = 12, y = 10 }

[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = "#0d111b"
foreground = "#e6f1ff"

[colors.cursor]
text = "#0d111b"
cursor = "#35d9ff"

[colors.selection]
text = "#e6f1ff"
background = "#26384d"

[colors.normal]
black = "#151e2b"
red = "#ff5d76"
green = "#73daca"
yellow = "#ffbd69"
blue = "#6ea8fe"
magenta = "#b69cff"
cyan = "#35d9ff"
white = "#c7d5e5"

[colors.bright]
black = "#526477"
red = "#ff8295"
green = "#9be7d2"
yellow = "#ffd18a"
blue = "#8bbcff"
magenta = "#c8b5ff"
cyan = "#73e6ff"
white = "#ffffff"
